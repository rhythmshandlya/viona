<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viona Template Playground</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #f8f8fa; color: #1a1a1f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d0d0d8; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #b8b8c0; }
      ::selection { background: rgba(249, 115, 22, 0.2); }
      input:focus, select:focus, textarea:focus { outline: none; border-color: #f97316 !important; box-shadow: 0 0 0 1px rgba(249,115,22,0.15); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
