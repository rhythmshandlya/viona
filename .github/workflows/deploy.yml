name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  # Run migrations first, before any deployments
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.ACTION_DEPLOY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run migrations
        run: |
          railway link -p 84a07d3b-cbeb-42ce-a189-bd3516d59879 -s api -e production
          railway run pnpm --filter @viona/api db:migrate

  deploy-landing:
    name: Deploy Landing
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.ACTION_DEPLOY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Landing
        run: |
          railway link -p 84a07d3b-cbeb-42ce-a189-bd3516d59879 -s landing -e production
          railway up -d
        working-directory: ./apps/landing

  deploy-web:
    name: Deploy Web App
    needs: [migrate]  # Wait for migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.ACTION_DEPLOY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Web
        run: |
          cp apps/web/railway.toml railway.toml
          railway link -p 84a07d3b-cbeb-42ce-a189-bd3516d59879 -s web -e production
          railway up -d

  deploy-api:
    name: Deploy API
    needs: [migrate]  # Wait for migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.ACTION_DEPLOY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        run: |
          cp packages/api/railway.toml railway.toml
          railway link -p 84a07d3b-cbeb-42ce-a189-bd3516d59879 -s api -e production
          railway up -d

  deploy-worker:
    name: Deploy Worker
    needs: [migrate]  # Wait for migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.ACTION_DEPLOY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Worker
        run: |
          cp packages/worker/railway.toml railway.toml
          railway link -p 84a07d3b-cbeb-42ce-a189-bd3516d59879 -s worker -e production
          railway up -d
