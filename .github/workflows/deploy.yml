name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  # Run migrations first, before any deployments
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Run migrations
        run: |
          railway link -p cllipify -s api -e production
          railway run pnpm --filter @reelify/api db:migrate

  deploy-landing:
    name: Deploy Landing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Landing
        run: |
          railway link -p cllipify -s landing -e production
          railway up -d
        working-directory: ./apps/landing

  deploy-web:
    name: Deploy Web App
    needs: [migrate]  # Wait for migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Web
        run: |
          railway link -p cllipify -s web -e production
          railway up -d

  deploy-api:
    name: Deploy API
    needs: [migrate]  # Wait for migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        run: |
          railway link -p cllipify -s api -e production
          railway up -d

  deploy-worker:
    name: Deploy Worker
    needs: [migrate]  # Wait for migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Worker
        run: |
          railway link -p cllipify -s worker -e production
          railway up -d
