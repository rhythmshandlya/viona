<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinetic Captions — Cinematic Lux</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;600;700;800;900&family=Bebas+Neue&family=Space+Grotesk:wght@400;600;700&family=Outfit:wght@400;600;700;800;900&family=Syne:wght@400;700;800&family=DM+Serif+Display:ital@0;1&family=Archivo+Black&family=Caveat:wght@700&family=Unbounded:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 100vh;
    font-family: 'Inter', sans-serif; color: #fff;
  }
  h1 { font-size: 14px; font-weight: 400; color: #888; margin-bottom: 24px; letter-spacing: 2px; text-transform: uppercase; }
  .controls { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
  .controls button { background: #222; border: 1px solid #333; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: background 0.2s; }
  .controls button:hover { background: #333; }
  .controls button.active { background: #e63946; border-color: #e63946; }
  .input-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
  .input-row input { background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 14px; width: 320px; }
  .input-row label { color: #888; font-size: 12px; }
  .hint { color: #555; font-size: 11px; margin-bottom: 16px; }
  .canvas-wrapper { position: relative; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  canvas { display: block; }
  .debug-panel { margin-top: 20px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: 11px; color: #aaa; max-width: 960px; width: 100%; font-family: monospace; white-space: pre-wrap; max-height: 500px; overflow-y: auto; }
  .preset-scroll { width: 960px; max-height: 120px; overflow-y: auto; display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; background: #0a0a0a; border: 1px solid #222; border-radius: 8px; margin-bottom: 16px; scrollbar-width: thin; scrollbar-color: #333 #111; }
  .preset-scroll::-webkit-scrollbar { width: 6px; }
  .preset-scroll::-webkit-scrollbar-track { background: #111; }
  .preset-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  .preset-btn { background: #151515; border: 1px solid #252525; color: #777; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 10px; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  .preset-btn:hover { background: #252525; color: #ddd; border-color: #444; }
  .preset-btn.active { background: #e63946; color: #fff; border-color: #e63946; }
  .preset-btn .hero-word { color: #e63946; font-weight: 700; }
  .preset-btn.active .hero-word { color: #fff; }
</style>
</head>
<body>

<h1>Kinetic Captions — Cinematic Lux</h1>

<div class="input-row">
  <input type="text" id="captionInput" value="How on earth do you achieve this" placeholder="Type caption..." style="width:380px" />
  <label>Hero indices:</label>
  <input type="text" id="heroIndicesInput" value="2" style="width:100px" placeholder="e.g. 0,2" />
  <button onclick="updateCaption()" style="background:#e63946;border:1px solid #e63946;color:#fff;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;">Apply</button>
</div>
<div class="hint">Hero indices: comma-separated. Consecutive merge. Satellite words group into lines with natural word spacing.</div>

<div class="controls">
  <button onclick="playAnimation()" class="active">Play</button>
  <button onclick="toggleDebug()">Debug</button>
  <button onclick="cycleColor()">Color</button>
  <button onclick="randomizeHero()">Rand Hero</button>
  <button onclick="cycleTemplate()">Next Template</button>
  <button onclick="autoPlayAll()" id="autoPlayBtn">Auto-Play All</button>
  <span id="templateLabel" style="color:#666;font-size:11px;padding:8px 0;">Cinematic Lux</span>
</div>

<div class="preset-scroll" id="presetList"></div>

<div class="canvas-wrapper">
  <canvas id="canvas" width="960" height="540"></canvas>
</div>

<div class="debug-panel" id="debugPanel" style="display:none;"></div>

<script src="https://cdn.jsdelivr.net/npm/kiwi.js@1.1.3/lib/kiwi.js"></script>

<script>
// ==========================================================================
// KINETIC CAPTION ENGINE — Fully Configurable
//
// ALL tunable parameters live in the CONFIG object below.
// Change any value and call buildLayout() to see the effect.
// ==========================================================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;


// ═══════════════════════════════════════════════════════════════════════════
// CONFIGURATION — every tunable parameter in one place
// ═══════════════════════════════════════════════════════════════════════════

const CONFIG = {

  // ── Canvas & Safe Zone ───────────────────────────────────────────────
  canvas: {
    width: W,
    height: H,
    verticalAnchor: 0.50,   // 0.0 = top, 0.5 = center, 1.0 = bottom
    safeMargin: 0.05,       // fraction of canvas dimensions (5% each side)
  },

  // ── Hero Typography ──────────────────────────────────────────────────
  hero: {
    fontFamily: "'Playfair Display'",
    fontWeight: '700',
    fontStyle: 'italic',
    color: '#e63946',
    colorCycle: ['#e63946', '#ff6b35', '#f4a261', '#2ec4b6', '#a855f7', '#ff477e'],
    sizeRatio: 0.45,        // hero fills this fraction of safe width
    maxFontSize: 140,       // px — clamp hero font size
    overflowClamp: 0.85,    // scale down if hero exceeds this fraction of safe width
    strokeColor: 'rgba(0,0,0,0.4)',
    strokeWidth: 2,
  },

  // ── Satellite Typography ─────────────────────────────────────────────
  satellite: {
    fontFamily: "'Inter'",
    fontWeight: '600',
    fontStyle: 'normal',
    color: '#ffffff',
    sizeRatio: 0.38,        // satellite font size = hero font size × this
    maxLineWidthRatio: 1.3, // max satellite line width = hero width × this
    wideLineThreshold: 0.8, // lines wider than this ratio of hero stay centered
  },

  // ── Layout ───────────────────────────────────────────────────────────
  layout: {
    lineInkGap: 5,          // px between ink edges of adjacent lines
    alignSnap: 8,           // px threshold for alignment snapping
    capHeightRatio: 0.72,   // cap height ≈ ascent × this (Latin approximation)
    inlineOrphanThreshold: 0.4, // satellite < this ratio of hero width → try inline placement
    inlineGap: 10,          // px horizontal gap between hero and inline satellite
  },

  // ── Shadow & Readability ─────────────────────────────────────────────
  shadow: {
    enabled: true,
    blur: 14,               // px blur radius
    opacity: 0.8,           // shadow layer opacity multiplier
    offsetY: 2,             // px vertical shadow offset
  },

  // ── Background ───────────────────────────────────────────────────────
  background: {
    gradient: [
      { stop: 0.0, color: '#1a1a2e' },
      { stop: 0.4, color: '#16213e' },
      { stop: 1.0, color: '#0f3460' },
    ],
    vignette: {
      innerRadius: 0.25,    // fraction of canvas width
      outerRadius: 0.95,
      opacity: 0.65,
    },
  },

  // ── Animation ────────────────────────────────────────────────────────
  animation: {
    hero: {
      duration: 350,        // ms — spring scale-in duration
      stagger: 120,         // ms between multiple hero entrances
      fadeSpeed: 4,         // opacity = min(1, progress × this)
      settleFactor: 1.5,    // animation done at duration × this
    },
    satellite: {
      duration: 200,        // ms per satellite line
      stagger: 80,          // ms between line entrances
      delayAfterHeroes: 180,// ms gap after last hero finishes
      slideOffset: -15,     // px — initial Y offset (negative = slide up)
    },
    spring: {
      // Critically-damped: ζ = 1.0, ω = 2π/duration
      // x(t) = 1 - (1 + ωt)e^(-ωt)
      damping: 1.0,         // ζ (1.0 = critically damped)
    },
  },

  // ── Debug Overlay ────────────────────────────────────────────────────
  debug: {
    safeZoneColor: '#0f0',
    inkBoxHeroColor: '#f44',
    inkBoxSatColor: '#4af',
    fontBoxColor: '#555',
    deadSpaceColor: '#f0f',
    baselineColor: '#ff0',
    charGapWordColor: '#0ff',
    charGapLetterColor: '#ff0',
    gapLabelFont: '9px monospace',
  },
};


// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════

let heroColorIdx = 0;
let showDebug = false;
let debugLines = [];
let words = [];
let heroIndices = [2];
let layoutBlocks = [];
let animState = null;


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 1: MEASUREMENT
// ═══════════════════════════════════════════════════════════════════════════

const measureCache = new Map();

function measureWord(text, fontSize, fontFamily, fontWeight, fontStyle) {
  const key = `${text}|${fontSize}|${fontFamily}|${fontWeight}|${fontStyle}`;
  if (measureCache.has(key)) return measureCache.get(key);

  ctx.save();
  ctx.font = `${fontStyle} ${fontWeight} ${fontSize}px ${fontFamily}`;
  const m = ctx.measureText(text);
  ctx.restore();

  const ascent = m.fontBoundingBoxAscent ?? m.actualBoundingBoxAscent ?? fontSize * 0.82;
  const descent = m.fontBoundingBoxDescent ?? m.actualBoundingBoxDescent ?? fontSize * 0.18;
  const inkAscent = m.actualBoundingBoxAscent ?? ascent;
  const inkDescent = m.actualBoundingBoxDescent ?? descent;
  const inkLeft = m.actualBoundingBoxLeft ?? 0;
  const inkRight = m.actualBoundingBoxRight ?? m.width;

  const result = {
    text, width: m.width, ascent, descent,
    height: ascent + descent,
    fontSize, fontFamily, fontWeight, fontStyle,
    capHeight: ascent * CONFIG.layout.capHeightRatio,
    inkAscent, inkDescent,
    inkHeight: inkAscent + inkDescent,
    inkLeft, inkRight,
    inkWidth: inkLeft + inkRight,
    deadAbove: ascent - inkAscent,
    deadBelow: descent - inkDescent,
  };
  measureCache.set(key, result);
  return result;
}

function measureNaturalWordGap(fontSize, fontFamily, fontWeight, fontStyle) {
  const key = `__space__|${fontSize}|${fontFamily}|${fontWeight}|${fontStyle}`;
  if (measureCache.has(key)) return measureCache.get(key);
  ctx.save();
  ctx.font = `${fontStyle} ${fontWeight} ${fontSize}px ${fontFamily}`;
  const w = ctx.measureText(' ').width;
  ctx.restore();
  measureCache.set(key, w);
  return w;
}

function analyzeCharGaps(block) {
  const { text, fontSize, font, weight, style } = block;
  ctx.save();
  ctx.font = `${style} ${weight} ${fontSize}px ${font}`;
  const chars = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const cm = ctx.measureText(ch);
    const prefix = text.substring(0, i);
    const xOff = i === 0 ? 0 : ctx.measureText(prefix).width;
    const inkL = xOff - (cm.actualBoundingBoxLeft ?? 0);
    const inkR = xOff + (cm.actualBoundingBoxRight ?? cm.width);
    chars.push({
      char: ch, x: xOff, advanceWidth: cm.width,
      inkLeft: inkL, inkRight: inkR, inkWidth: inkR - inkL,
      inkAscent: cm.actualBoundingBoxAscent ?? block.measure.inkAscent,
      inkDescent: cm.actualBoundingBoxDescent ?? block.measure.inkDescent,
    });
  }
  const gaps = [];
  for (let i = 0; i < chars.length - 1; i++) {
    const gw = chars[i + 1].inkLeft - chars[i].inkRight;
    if (gw > 1) {
      gaps.push({
        afterChar: chars[i].char, beforeChar: chars[i + 1].char,
        x: chars[i].inkRight, width: gw,
        isWordBreak: chars[i].char === ' ' || chars[i + 1].char === ' ',
      });
    }
  }
  ctx.restore();
  return { chars, gaps };
}


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 2: BUILD LINES
// ═══════════════════════════════════════════════════════════════════════════

function findConsecutiveRuns(indices) {
  if (indices.length === 0) return [];
  const sorted = [...new Set(indices)].sort((a, b) => a - b);
  const runs = [[sorted[0]]];
  for (let i = 1; i < sorted.length; i++) {
    if (sorted[i] === sorted[i-1] + 1) runs[runs.length - 1].push(sorted[i]);
    else runs.push([sorted[i]]);
  }
  return runs;
}

function computeHeroSize(heroText) {
  const C = CONFIG;
  const safeW = W * (1 - 2 * C.canvas.safeMargin);
  const targetW = safeW * C.hero.sizeRatio;
  let fs = 72;
  let m = measureWord(heroText, fs, C.hero.fontFamily, C.hero.fontWeight, C.hero.fontStyle);
  fs = Math.round(fs * (targetW / m.width));
  fs = Math.min(fs, C.hero.maxFontSize);
  m = measureWord(heroText, fs, C.hero.fontFamily, C.hero.fontWeight, C.hero.fontStyle);
  if (m.width > safeW * C.hero.overflowClamp) {
    fs = Math.round(fs * (safeW * C.hero.overflowClamp) / m.width);
  }
  return fs;
}

function buildLines(wordList, heroIdxArray) {
  const C = CONFIG;
  const heroSet = new Set(heroIdxArray);
  const heroRuns = findConsecutiveRuns(heroIdxArray);

  let longestHeroText = '';
  for (const run of heroRuns) {
    const text = run.map(i => wordList[i]).join(' ');
    if (text.length > longestHeroText.length) longestHeroText = text;
  }
  const heroFs = computeHeroSize(longestHeroText);
  const satFs = Math.round(heroFs * C.satellite.sizeRatio);

  const heroMeasure = measureWord(longestHeroText, heroFs, C.hero.fontFamily, C.hero.fontWeight, C.hero.fontStyle);
  const safeW = W * (1 - 2 * C.canvas.safeMargin);
  const maxLineWidth = Math.min(heroMeasure.width * C.satellite.maxLineWidthRatio, safeW);
  const wordGap = measureNaturalWordGap(satFs, C.satellite.fontFamily, C.satellite.fontWeight, C.satellite.fontStyle);

  const blocks = [];
  let i = 0;

  while (i < wordList.length) {
    if (heroSet.has(i)) {
      const run = heroRuns.find(r => r.includes(i));
      const text = run.map(idx => wordList[idx]).join(' ');
      const m = measureWord(text, heroFs, C.hero.fontFamily, C.hero.fontWeight, C.hero.fontStyle);
      blocks.push({
        type: 'hero', heroOrder: heroRuns.indexOf(run),
        wordIndices: [...run], text, measure: m, fontSize: heroFs,
        font: C.hero.fontFamily, weight: C.hero.fontWeight,
        style: C.hero.fontStyle, color: C.hero.color,
        x: 0, y: 0,
      });
      i = run[run.length - 1] + 1;
    } else {
      const satWords = [];
      while (i < wordList.length && !heroSet.has(i)) {
        satWords.push({ word: wordList[i], index: i });
        i++;
      }

      let lineWords = [], lineIndices = [], lineW = 0;
      for (const sw of satWords) {
        const wm = measureWord(sw.word, satFs, C.satellite.fontFamily, C.satellite.fontWeight, C.satellite.fontStyle);
        const needed = wm.width + (lineWords.length > 0 ? wordGap : 0);
        if (lineW + needed > maxLineWidth && lineWords.length > 0) {
          const lineText = lineWords.join(' ');
          const m = measureWord(lineText, satFs, C.satellite.fontFamily, C.satellite.fontWeight, C.satellite.fontStyle);
          blocks.push({
            type: 'satellite', wordIndices: [...lineIndices],
            text: lineText, measure: m, fontSize: satFs,
            font: C.satellite.fontFamily, weight: C.satellite.fontWeight,
            style: C.satellite.fontStyle, color: C.satellite.color,
            x: 0, y: 0,
          });
          lineWords = []; lineIndices = []; lineW = 0;
        }
        lineW += needed;
        lineWords.push(sw.word);
        lineIndices.push(sw.index);
      }
      if (lineWords.length > 0) {
        const lineText = lineWords.join(' ');
        const m = measureWord(lineText, satFs, C.satellite.fontFamily, C.satellite.fontWeight, C.satellite.fontStyle);
        blocks.push({
          type: 'satellite', wordIndices: [...lineIndices],
          text: lineText, measure: m, fontSize: satFs,
          font: C.satellite.fontFamily, weight: C.satellite.fontWeight,
          style: C.satellite.fontStyle, color: C.satellite.color,
          x: 0, y: 0,
        });
      }
    }
  }
  // ── Merge short orphan satellite lines ──
  // A satellite line that's very short (< 40% of hero width) and alone between
  // heroes wastes a full row. Merge it into the nearest adjacent satellite line
  // if the combined width fits within maxLineWidth.
  const heroWidthRef = blocks.find(b => b.type === 'hero')?.measure.width ?? safeW;
  let merged = true;
  while (merged) {
    merged = false;
    for (let j = 0; j < blocks.length; j++) {
      const b = blocks[j];
      if (b.type !== 'satellite') continue;
      if (b.measure.width >= heroWidthRef * 0.4) continue; // not short enough to merge

      // Find nearest satellite neighbor (skip heroes)
      let bestIdx = -1, bestDist = Infinity;
      for (let k = 0; k < blocks.length; k++) {
        if (k === j || blocks[k].type !== 'satellite') continue;
        const dist = Math.abs(k - j);
        if (dist < bestDist) { bestDist = dist; bestIdx = k; }
      }
      if (bestIdx === -1) continue;

      const neighbor = blocks[bestIdx];
      const combinedText = bestIdx < j
        ? neighbor.text + ' ' + b.text
        : b.text + ' ' + neighbor.text;
      const combinedM = measureWord(combinedText, satFs, C.satellite.fontFamily, C.satellite.fontWeight, C.satellite.fontStyle);

      if (combinedM.width <= maxLineWidth) {
        // Merge: combine word indices and text, replace neighbor, remove orphan
        const combinedIndices = bestIdx < j
          ? [...neighbor.wordIndices, ...b.wordIndices]
          : [...b.wordIndices, ...neighbor.wordIndices];
        neighbor.text = combinedText;
        neighbor.measure = combinedM;
        neighbor.wordIndices = combinedIndices;
        blocks.splice(j, 1);
        merged = true;
        break; // restart scan after mutation
      }
    }
  }

  return blocks;
}


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 3: LINE LAYOUT
// ═══════════════════════════════════════════════════════════════════════════

function layoutLines(blocks) {
  const C = CONFIG;
  const centerX = W / 2;
  const centerY = H * C.canvas.verticalAnchor;
  const gap = C.layout.lineInkGap;
  const hGap = C.layout.inlineGap;
  const safeW = W * (1 - 2 * C.canvas.safeMargin);
  const sL = W * C.canvas.safeMargin;
  const sR = W * (1 - C.canvas.safeMargin);

  const heroes = blocks.filter(b => b.type === 'hero');
  if (heroes.length === 0) {
    // No heroes — just stack centered
    let totalInkH = blocks.reduce((s, b) => s + b.measure.inkHeight, 0) + Math.max(0, blocks.length - 1) * gap;
    let curY = centerY - totalInkH / 2;
    for (const row of blocks) {
      row.x = centerX - row.measure.width / 2;
      row.y = curY + row.measure.inkAscent;
      curY += row.measure.inkHeight + gap;
    }
    return blocks;
  }

  // ── Step 1: Detect inline orphans ──
  // A satellite that's immediately adjacent to a hero AND very short
  // (< inlineOrphanThreshold of hero width) AND fits beside the hero.
  // These get placed inline instead of taking their own row.
  const inlineMap = new Map(); // satellite index → hero index it inlines with

  for (let i = 0; i < blocks.length; i++) {
    if (blocks[i].type !== 'satellite') continue;
    const sat = blocks[i];

    // Must be directly adjacent to a hero (no other block between)
    const prevIsHero = i > 0 && blocks[i - 1].type === 'hero';
    const nextIsHero = i < blocks.length - 1 && blocks[i + 1].type === 'hero';
    if (!prevIsHero && !nextIsHero) continue;

    // Pick the adjacent hero
    const heroIdx = prevIsHero ? i - 1 : i + 1;
    const hero = blocks[heroIdx];

    // Must be a single tiny word (≤ 4 chars) — longer words get their own row
    if (sat.wordIndices.length > 1) continue;
    if (sat.text.length > 4) continue;
    if (sat.measure.width / hero.measure.width >= C.layout.inlineOrphanThreshold) continue;

    // Must fit beside the hero
    if (hero.measure.width + hGap + sat.measure.width > safeW) continue;

    // Already has an inline on this side? Skip (one per side max)
    const existingSide = prevIsHero ? 'after' : 'before';
    let sideConflict = false;
    for (const [si, hi] of inlineMap) {
      if (hi === heroIdx) {
        const otherSide = si < heroIdx ? 'before' : 'after';
        if (otherSide === existingSide) { sideConflict = true; break; }
      }
    }
    if (sideConflict) continue;

    inlineMap.set(i, heroIdx);
  }

  // ── Step 2: Stack non-inline blocks vertically ──
  const stackBlocks = blocks.filter((_, i) => !inlineMap.has(i));

  let totalInkH = stackBlocks.reduce((s, b) => s + b.measure.inkHeight, 0);
  totalInkH += Math.max(0, stackBlocks.length - 1) * gap;

  let curY = centerY - totalInkH / 2;
  for (const row of stackBlocks) {
    row.x = centerX - row.measure.width / 2;
    row.y = curY + row.measure.inkAscent;
    curY += row.measure.inkHeight + gap;
  }

  // ── Step 3: Place inline orphans beside their hero ──
  for (const [satIdx, heroIdx] of inlineMap) {
    const sat = blocks[satIdx];
    const hero = blocks[heroIdx];
    const isBefore = satIdx < heroIdx;

    // Horizontal: place to left or right of hero
    if (isBefore) {
      sat.x = hero.x - hGap - sat.measure.width;
    } else {
      sat.x = hero.x + hero.measure.width + hGap;
    }

    // Clamp to safe zone
    if (sat.x < sL) sat.x = sL;
    if (sat.x + sat.measure.width > sR) sat.x = sR - sat.measure.width;

    // Vertical: center satellite's ink against hero's ink center
    const heroInkCenter = hero.y - hero.measure.inkAscent + hero.measure.inkHeight / 2;
    sat.y = heroInkCenter - sat.measure.inkHeight / 2 + sat.measure.inkAscent;
  }

  // ── Step 4: Smart alignment for remaining standalone satellites ──
  const heroLeft = Math.min(...heroes.map(h => h.x));
  const heroRight = Math.max(...heroes.map(h => h.x + h.measure.width));
  const heroWidth = heroRight - heroLeft;

  for (const sat of blocks.filter(b => b.type === 'satellite')) {
    if (inlineMap.has(blocks.indexOf(sat))) continue;
    if (sat.measure.width / heroWidth >= C.satellite.wideLineThreshold) continue;

    const satIdx = blocks.indexOf(sat);
    let nearestHero = heroes[0], minDist = Infinity;
    for (const h of heroes) {
      const d = Math.abs(blocks.indexOf(h) - satIdx);
      if (d < minDist) { minDist = d; nearestHero = h; }
    }

    const isBefore = satIdx < blocks.indexOf(nearestHero);
    const candidateX = isBefore ? heroLeft : heroRight - sat.measure.width;
    if (candidateX >= sL && candidateX + sat.measure.width <= sR) {
      sat.x = candidateX;
    }
  }

  return blocks;
}


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 4A: CASSOWARY REFINEMENT
// ═══════════════════════════════════════════════════════════════════════════

function cassowaryRefine(blocks) {
  const C = CONFIG;
  const sL = W * C.canvas.safeMargin, sR = W * (1 - C.canvas.safeMargin);
  const sT = H * C.canvas.safeMargin, sB = H * (1 - C.canvas.safeMargin);

  const solver = new kiwi.Solver();
  for (const block of blocks) {
    block._vx = new kiwi.Variable(`${block.text}_x`);
    block._vy = new kiwi.Variable(`${block.text}_y`);

    solver.addConstraint(new kiwi.Constraint(new kiwi.Expression(block._vx, -sL), kiwi.Operator.Ge, undefined, kiwi.Strength.required));
    solver.addConstraint(new kiwi.Constraint(new kiwi.Expression([-1, block._vx], sR - block.measure.width), kiwi.Operator.Ge, undefined, kiwi.Strength.required));
    solver.addConstraint(new kiwi.Constraint(new kiwi.Expression(block._vy, -(sT + block.measure.ascent)), kiwi.Operator.Ge, undefined, kiwi.Strength.required));
    solver.addConstraint(new kiwi.Constraint(new kiwi.Expression([-1, block._vy], sB - block.measure.descent), kiwi.Operator.Ge, undefined, kiwi.Strength.required));

    solver.addEditVariable(block._vx, kiwi.Strength.strong);
    solver.suggestValue(block._vx, block.x);
    solver.addEditVariable(block._vy, kiwi.Strength.strong);
    solver.suggestValue(block._vy, block.y);
  }

  const sorted = [...blocks].sort((a, b) => a.y - b.y);
  for (let i = 0; i < sorted.length - 1; i++) {
    if (Math.abs(sorted[i].y - sorted[i+1].y) > 5) {
      solver.addConstraint(new kiwi.Constraint(
        new kiwi.Expression(sorted[i+1]._vy, [-1, sorted[i]._vy], -1),
        kiwi.Operator.Ge, undefined, kiwi.Strength.medium));
    }
  }

  solver.updateVariables();
  for (const block of blocks) {
    block.x = block._vx.value(); block.y = block._vy.value();
    delete block._vx; delete block._vy;
  }
}


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 4B: ALIGNMENT SNAPPING
// ═══════════════════════════════════════════════════════════════════════════

function alignmentSnapping(blocks) {
  const snap = CONFIG.layout.alignSnap;
  let snaps = 0;
  for (let i = 0; i < blocks.length; i++) {
    for (let j = i + 1; j < blocks.length; j++) {
      const a = blocks[i], b = blocks[j];
      const aCx = a.x + a.measure.width / 2, bCx = b.x + b.measure.width / 2;
      if (Math.abs(aCx - bCx) > 0.5 && Math.abs(aCx - bCx) < snap) {
        const avg = (aCx + bCx) / 2;
        a.x = avg - a.measure.width / 2; b.x = avg - b.measure.width / 2; snaps++;
      }
      if (Math.abs(a.x - b.x) > 0.5 && Math.abs(a.x - b.x) < snap) {
        const avg = (a.x + b.x) / 2; a.x = avg; b.x = avg; snaps++;
      }
    }
  }
  return snaps;
}


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 5: RENDER
// ═══════════════════════════════════════════════════════════════════════════

const shadowCanvas = document.createElement('canvas');
shadowCanvas.width = W; shadowCanvas.height = H;
const shadowCtx = shadowCanvas.getContext('2d');

function renderBackground() {
  const bg = CONFIG.background;
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  for (const s of bg.gradient) grad.addColorStop(s.stop, s.color);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const v = bg.vignette;
  const vig = ctx.createRadialGradient(W/2, H*0.5, W*v.innerRadius, W/2, H*0.5, W*v.outerRadius);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, `rgba(0,0,0,${v.opacity})`);
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

function renderBlock(block, scale, opacity, offsetX, offsetY) {
  if (opacity <= 0.001 || scale <= 0.001) return;
  const S = CONFIG.shadow;
  const H_CFG = CONFIG.hero;
  const drawX = block.x + offsetX;
  const drawY = block.y + offsetY;
  const cx = drawX + block.measure.width / 2;
  const cy = drawY - block.measure.capHeight / 2;

  if (S.enabled) {
    shadowCtx.clearRect(0, 0, W, H);
    shadowCtx.save();
    shadowCtx.globalAlpha = opacity * S.opacity;
    shadowCtx.textBaseline = 'alphabetic';
    shadowCtx.translate(cx, cy); shadowCtx.scale(scale, scale); shadowCtx.translate(-cx, -cy);
    shadowCtx.font = `${block.style} ${block.weight} ${block.fontSize}px ${block.font}`;
    shadowCtx.fillStyle = '#000';
    shadowCtx.filter = `blur(${S.blur}px)`;
    shadowCtx.fillText(block.text, drawX, drawY + S.offsetY);
    shadowCtx.restore();
    ctx.drawImage(shadowCanvas, 0, 0);
  }

  ctx.save();
  ctx.globalAlpha = opacity;
  ctx.textBaseline = 'alphabetic';
  ctx.translate(cx, cy); ctx.scale(scale, scale); ctx.translate(-cx, -cy);
  ctx.font = `${block.style} ${block.weight} ${block.fontSize}px ${block.font}`;

  if (block.type === 'hero') {
    ctx.strokeStyle = H_CFG.strokeColor;
    ctx.lineWidth = H_CFG.strokeWidth; ctx.lineJoin = 'round';
    ctx.strokeText(block.text, drawX, drawY);
  }

  ctx.fillStyle = block.color;
  ctx.fillText(block.text, drawX, drawY);
  ctx.restore();
}

function renderDebugOverlay(blocks) {
  if (!showDebug) return;
  const D = CONFIG.debug;
  const C = CONFIG;
  ctx.save();

  // Safe zone
  ctx.globalAlpha = 0.3; ctx.setLineDash([4, 4]);
  ctx.strokeStyle = D.safeZoneColor; ctx.lineWidth = 1;
  const sL = W * C.canvas.safeMargin, sT = H * C.canvas.safeMargin;
  ctx.strokeRect(sL, sT, W * (1 - 2*C.canvas.safeMargin), H * (1 - 2*C.canvas.safeMargin));

  for (const block of blocks) {
    ctx.globalAlpha = 0.08; ctx.fillStyle = D.deadSpaceColor;
    if (block.measure.deadAbove > 0) ctx.fillRect(block.x, block.y - block.measure.ascent, block.measure.width, block.measure.deadAbove);
    if (block.measure.deadBelow > 0) ctx.fillRect(block.x, block.y + block.measure.inkDescent, block.measure.width, block.measure.deadBelow);

    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = block.type === 'hero' ? D.inkBoxHeroColor : D.inkBoxSatColor;
    ctx.setLineDash([]); ctx.lineWidth = 1.5;
    ctx.strokeRect(block.x, block.y - block.measure.inkAscent, block.measure.width, block.measure.inkHeight);

    ctx.globalAlpha = 0.15; ctx.strokeStyle = D.fontBoxColor;
    ctx.setLineDash([2, 4]); ctx.lineWidth = 0.5;
    ctx.strokeRect(block.x, block.y - block.measure.ascent, block.measure.width, block.measure.height);

    if (block.type === 'hero') {
      const ga = analyzeCharGaps(block);
      ctx.globalAlpha = 0.2; ctx.setLineDash([]);
      for (const g of ga.gaps) {
        ctx.fillStyle = g.isWordBreak ? D.charGapWordColor : D.charGapLetterColor;
        ctx.fillRect(block.x + g.x, block.y - block.measure.inkAscent, g.width, block.measure.inkHeight);
      }
    }

    ctx.globalAlpha = 0.3; ctx.strokeStyle = D.baselineColor; ctx.lineWidth = 0.5;
    ctx.setLineDash([2, 3]);
    ctx.beginPath(); ctx.moveTo(block.x - 3, block.y); ctx.lineTo(block.x + block.measure.width + 3, block.y); ctx.stroke();
  }

  // Ink gap measurements
  const sorted = [...blocks].sort((a, b) => a.y - b.y);
  for (let i = 0; i < sorted.length - 1; i++) {
    const bot = sorted[i].y + sorted[i].measure.inkDescent;
    const top = sorted[i+1].y - sorted[i+1].measure.inkAscent;
    const gap = top - bot;
    const mx = Math.max(sorted[i].x + sorted[i].measure.width, sorted[i+1].x + sorted[i+1].measure.width) + 8;
    ctx.globalAlpha = 0.6; ctx.strokeStyle = gap < 2 ? '#f44' : '#0f0';
    ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(mx, bot); ctx.lineTo(mx, top); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mx-3, bot); ctx.lineTo(mx+3, bot); ctx.moveTo(mx-3, top); ctx.lineTo(mx+3, top); ctx.stroke();
    ctx.font = D.gapLabelFont; ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle';
    ctx.fillText(`${gap.toFixed(0)}px`, mx + 6, (bot + top) / 2);
  }

  ctx.strokeStyle = '#fff'; ctx.globalAlpha = 0.3; ctx.setLineDash([]); ctx.lineWidth = 0.5;
  ctx.beginPath();
  ctx.moveTo(W/2 - 12, H * C.canvas.verticalAnchor); ctx.lineTo(W/2 + 12, H * C.canvas.verticalAnchor);
  ctx.moveTo(W/2, H * C.canvas.verticalAnchor - 12); ctx.lineTo(W/2, H * C.canvas.verticalAnchor + 12);
  ctx.stroke();
  ctx.restore();
}


// ═══════════════════════════════════════════════════════════════════════════
// PHASE 6: ANIMATION
// ═══════════════════════════════════════════════════════════════════════════

function criticallyDampedSpring(t_sec, dur_sec) {
  const omega = (2 * Math.PI) / dur_sec;
  const ot = omega * t_sec;
  return 1 - (1 + ot) * Math.exp(-ot);
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 3);
}

function startAnimation() {
  const A = CONFIG.animation;
  const heroCount = layoutBlocks.filter(b => b.type === 'hero').length;
  animState = {
    startTime: performance.now(),
    heroDur: A.hero.duration,
    heroStagger: A.hero.stagger,
    lineDur: A.satellite.duration,
    lineStagger: A.satellite.stagger,
    lineDelay: A.hero.duration + (heroCount - 1) * A.hero.stagger + A.satellite.delayAfterHeroes,
  };
}

function getBlockAnim(block, elapsed) {
  if (!animState) return { scale: 1, opacity: 1, offsetX: 0, offsetY: 0 };
  const s = animState;
  const A = CONFIG.animation;

  if (block.type === 'hero') {
    const start = (block.heroOrder ?? 0) * s.heroStagger;
    const t = Math.max(0, elapsed - start);
    if (t >= s.heroDur * A.hero.settleFactor) return { scale: 1, opacity: 1, offsetX: 0, offsetY: 0 };
    return {
      scale: criticallyDampedSpring(t / 1000, s.heroDur / 1000),
      opacity: Math.min(1, (t / s.heroDur) * A.hero.fadeSpeed),
      offsetX: 0, offsetY: 0,
    };
  }

  const allLines = layoutBlocks.filter(b => b.type === 'satellite').sort((a, b) => a.wordIndices[0] - b.wordIndices[0]);
  const idx = allLines.indexOf(block);
  const start = s.lineDelay + idx * s.lineStagger;
  const t = elapsed - start;
  const slideY = A.satellite.slideOffset;

  if (t <= 0) return { scale: 1, opacity: 0, offsetX: 0, offsetY: slideY };
  if (t >= s.lineDur) return { scale: 1, opacity: 1, offsetX: 0, offsetY: 0 };
  const p = easeOutCubic(t / s.lineDur);
  return { scale: 1, opacity: p, offsetX: 0, offsetY: slideY * (1 - p) };
}


// ═══════════════════════════════════════════════════════════════════════════
// ORCHESTRATOR
// ═══════════════════════════════════════════════════════════════════════════

function buildLayout() {
  measureCache.clear();
  debugLines = [];
  const timings = {};
  const t0 = performance.now();

  const blocks = buildLines(words, heroIndices);
  timings.build = performance.now() - t0;

  const heroBlocks = blocks.filter(b => b.type === 'hero');
  const lineBlocks = blocks.filter(b => b.type === 'satellite');

  debugLines.push(`KINETIC CAPTION ENGINE — CONFIG-DRIVEN`);
  debugLines.push(`${'═'.repeat(55)}`);
  debugLines.push(`Words: [${words.join(', ')}]`);
  debugLines.push(`Heroes: [${heroIndices}] → ${heroBlocks.map(b => `"${b.text}"`).join(', ')}`);
  debugLines.push(`Blocks: ${blocks.length} (${heroBlocks.length} hero, ${lineBlocks.length} satellite)`);
  for (const l of lineBlocks) debugLines.push(`  LINE: "${l.text}" (words ${l.wordIndices.join(',')}), w=${l.measure.width.toFixed(0)}px`);
  debugLines.push(``);

  const t1 = performance.now();
  layoutLines(blocks);
  timings.layout = performance.now() - t1;
  debugLines.push(`Phase 3: Line layout (ink-gap: ${CONFIG.layout.lineInkGap}px)`);

  const t2 = performance.now();
  try { cassowaryRefine(blocks); debugLines.push(`Phase 4A: Cassowary — OK`); }
  catch (e) { debugLines.push(`Phase 4A: Cassowary FAILED: ${e.message}`); }
  timings.cassowary = performance.now() - t2;

  const snaps = alignmentSnapping(blocks);
  debugLines.push(`Phase 4B: Snap — ${snaps}`);

  debugLines.push(``);
  debugLines.push(`TIMINGS: build=${timings.build.toFixed(1)}ms layout=${timings.layout.toFixed(1)}ms cass=${timings.cassowary.toFixed(1)}ms total=${(performance.now()-t0).toFixed(1)}ms`);
  debugLines.push(``);

  debugLines.push(`BLOCKS:`);
  for (const b of blocks) {
    const tag = b.type === 'hero' ? `HERO-${b.heroOrder}` : `line`;
    debugLines.push(`  [${tag.padEnd(7)}] "${b.text}"  ${b.fontSize}px  pos(${b.x.toFixed(1)}, ${b.y.toFixed(1)})  ink:${b.measure.inkAscent.toFixed(0)}↑${b.measure.inkDescent.toFixed(0)}↓  dead:${b.measure.deadAbove.toFixed(0)}↑${b.measure.deadBelow.toFixed(0)}↓`);
  }

  debugLines.push(``);
  debugLines.push(`INK GAPS:`);
  const sorted = [...blocks].sort((a, b) => a.y - b.y);
  for (let i = 0; i < sorted.length - 1; i++) {
    const g = (sorted[i+1].y - sorted[i+1].measure.inkAscent) - (sorted[i].y + sorted[i].measure.inkDescent);
    debugLines.push(`  "${sorted[i].text}" → "${sorted[i+1].text}":  ${g.toFixed(1)}px`);
  }

  debugLines.push(``);
  debugLines.push(`HERO CHAR GAPS:`);
  for (const b of heroBlocks) {
    const ga = analyzeCharGaps(b);
    const ws = ga.gaps.reduce((s, g) => s + g.width, 0);
    debugLines.push(`  "${b.text}": ${ga.gaps.length} gaps, ${ws.toFixed(0)}px/${b.measure.width.toFixed(0)}px (${(ws/b.measure.width*100).toFixed(0)}%)`);
    for (const g of ga.gaps) debugLines.push(`    ${g.isWordBreak?'WORD':'LTTR'} "${g.afterChar}"→"${g.beforeChar}": ${g.width.toFixed(1)}px @x=${g.x.toFixed(0)}`);
  }

  debugLines.push(``);
  debugLines.push(`CONFIG DUMP:`);
  debugLines.push(JSON.stringify(CONFIG, null, 2));

  layoutBlocks = blocks;
  document.getElementById('debugPanel').textContent = debugLines.join('\n');
}


// ═══════════════════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════════════════

function render(timestamp) {
  ctx.clearRect(0, 0, W, H);
  renderBackground();
  const elapsed = animState ? timestamp - animState.startTime : Infinity;
  for (const block of layoutBlocks) {
    const anim = getBlockAnim(block, elapsed);
    renderBlock(block, anim.scale, anim.opacity, anim.offsetX, anim.offsetY);
  }
  renderDebugOverlay(layoutBlocks);
  requestAnimationFrame(render);
}

// CONTROLS
// ═══════════════════════════════════════════════════════════════════════════

let activePresetIdx = -1;
let autoPlayTimer = null;

function renderPresetList() {
  const el = document.getElementById('presetList');
  el.innerHTML = '';
  PRESETS.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn' + (i === activePresetIdx ? ' active' : '');
    const ws = p.text.split(/\s+/);
    const hs = new Set(p.heroes);
    btn.innerHTML = ws.map((w, j) => hs.has(j) ? `<span class="hero-word">${w}</span>` : w).join(' ');
    btn.onclick = () => loadPreset(i);
    el.appendChild(btn);
  });
}

function loadPreset(index) {
  activePresetIdx = index;
  const p = PRESETS[index];
  document.getElementById('captionInput').value = p.text;
  document.getElementById('heroIndicesInput').value = p.heroes.join(',');
  words = p.text.split(/\s+/);
  heroIndices = [...p.heroes];
  buildLayout(); startAnimation(); renderPresetList();
  const btns = document.querySelectorAll('.preset-btn');
  if (btns[index]) btns[index].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function randomizeHero() {
  const start = Math.floor(Math.random() * words.length);
  const len = Math.min(1 + Math.floor(Math.random() * 3), words.length - start);
  heroIndices = Array.from({ length: len }, (_, i) => start + i);
  document.getElementById('heroIndicesInput').value = heroIndices.join(',');
  activePresetIdx = -1;
  buildLayout(); startAnimation(); renderPresetList();
}

function autoPlayAll() {
  const btn = document.getElementById('autoPlayBtn');
  if (autoPlayTimer) { clearInterval(autoPlayTimer); autoPlayTimer = null; btn.textContent = 'Auto-Play All'; btn.classList.remove('active'); return; }
  btn.textContent = 'Stop Auto'; btn.classList.add('active');
  let idx = 0; loadPreset(idx);
  autoPlayTimer = setInterval(() => { idx = (idx + 1) % PRESETS.length; loadPreset(idx); }, 2500);
}

function parseHeroIndices(str, maxLen) {
  return str.split(',').map(s => parseInt(s.trim(), 10)).filter(n => !isNaN(n) && n >= 0 && n < maxLen);
}

function updateCaption() {
  words = document.getElementById('captionInput').value.trim().split(/\s+/);
  heroIndices = parseHeroIndices(document.getElementById('heroIndicesInput').value.trim(), words.length);
  if (heroIndices.length === 0) heroIndices = [0];
  activePresetIdx = -1;
  buildLayout(); startAnimation(); renderPresetList();
}

function playAnimation() { startAnimation(); }

function toggleDebug() {
  showDebug = !showDebug;
  document.getElementById('debugPanel').style.display = showDebug ? 'block' : 'none';
}

function cycleColor() {
  heroColorIdx = (heroColorIdx + 1) % CONFIG.hero.colorCycle.length;
  CONFIG.hero.color = CONFIG.hero.colorCycle[heroColorIdx];
  buildLayout(); startAnimation();
}

let templateIdx = 0;

function applyTemplate(t) {
  Object.assign(CONFIG.hero, t.hero);
  CONFIG.hero.colorCycle[0] = t.hero.color;
  Object.assign(CONFIG.satellite, t.satellite);
  Object.assign(CONFIG.shadow, t.shadow);
  CONFIG.background.gradient = t.background.gradient;
  Object.assign(CONFIG.background.vignette, t.background.vignette);
  document.getElementById('templateLabel').textContent = t.name;
}

function cycleTemplate() {
  templateIdx = (templateIdx + 1) % TEMPLATES.length;
  applyTemplate(TEMPLATES[templateIdx]);
  measureCache.clear();
  buildLayout();
  startAnimation();
}
